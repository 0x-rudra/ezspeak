<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';">
    <title>listner-indicator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: transparent;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 530px;
            height: 76px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #f4f4f5;
        }

        /* ── Glassmorphic Dictation Capsule ─────────────────────────── */
        .capsule {
            width: 510px;
            height: 60px;
            background: rgba(18, 18, 24, 0.94);
            backdrop-filter: blur(24px) saturate(190%);
            -webkit-backdrop-filter: blur(24px) saturate(190%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 9999px;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.55), 
                        0 0 0 1px rgba(255, 255, 255, 0.05),
                        0 0 24px rgba(99, 102, 241, 0.15);
            display: flex;
            align-items: center;
            padding: 0 14px;
            gap: 10px;
            cursor: grab;
            transition: border-color 0.25s ease, box-shadow 0.25s ease, transform 0.15s ease;
        }

        .capsule:active,
        .capsule.dragging {
            cursor: grabbing;
            transform: scale(1.02);
            box-shadow: 0 20px 48px rgba(0, 0, 0, 0.75), 0 0 28px rgba(99, 102, 241, 0.35);
        }

        /* ── Drag Grip Handle ────────────────────────────────────────── */
        .drag-handle {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #71717a;
            cursor: grab;
            padding: 4px 2px;
            flex-shrink: 0;
            opacity: 0.6;
            transition: opacity 0.2s, color 0.2s;
        }

        .capsule:hover .drag-handle {
            opacity: 1;
            color: #a1a1aa;
        }

        .capsule.dragging .drag-handle {
            cursor: grabbing;
            color: #38bdf8;
        }

        .capsule.listening {
            border-color: rgba(34, 197, 94, 0.35);
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.55), 
                        0 0 24px rgba(34, 197, 94, 0.2);
        }

        .capsule.transcribing {
            border-color: rgba(168, 85, 247, 0.4);
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.55), 
                        0 0 24px rgba(168, 85, 247, 0.25);
        }

        .capsule.translating {
            border-color: rgba(249, 115, 22, 0.5);
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.55), 
                        0 0 24px rgba(249, 115, 22, 0.3);
        }

        /* ── Left Mic & Wave ────────────────────────────────────────── */
        .mic-section {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
            -webkit-app-region: no-drag;
        }

        .mic-icon-wrapper {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(34, 197, 94, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #4ade80;
            position: relative;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .capsule.transcribing .mic-icon-wrapper {
            background: rgba(168, 85, 247, 0.15);
            color: #c084fc;
        }

        .capsule.translating .mic-icon-wrapper {
            background: rgba(249, 115, 22, 0.18);
            color: #fb923c;
        }

        .pulse-ring {
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            border: 1.5px solid currentColor;
            opacity: 0.6;
            animation: pulse-wave 1.8s cubic-bezier(0.24, 0, 0.38, 1) infinite;
        }

        @keyframes pulse-wave {
            0% { transform: scale(0.9); opacity: 0.8; }
            70% { transform: scale(1.3); opacity: 0; }
            100% { transform: scale(1.3); opacity: 0; }
        }

        #miniWaveCanvas {
            width: 36px;
            height: 24px;
            display: block;
        }

        /* ── Center Live Content ────────────────────────────────────── */
        .content-section {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 2px;
            overflow: hidden;
        }

        .status-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 6px #22c55e;
            transition: background 0.25s ease;
        }

        .capsule.transcribing .status-dot {
            background: #a855f7;
            box-shadow: 0 0 6px #a855f7;
        }

        .capsule.translating .status-dot {
            background: #f97316;
            box-shadow: 0 0 6px #f97316;
        }

        .status-text {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: #a1a1aa;
        }

        .live-text {
            font-size: 13.5px;
            font-weight: 500;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.25;
            transition: color 0.2s ease;
        }

        .live-text.placeholder {
            color: #71717a;
            font-style: italic;
        }

        /* ── Right Actions ─────────────────────────────────────────── */
        .actions-section {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
            -webkit-app-region: no-drag;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e4e4e7;
            cursor: pointer;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 600;
            padding: 5px 9px;
            gap: 4px;
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.16);
            color: #ffffff;
            transform: translateY(-0.5px);
        }

        .action-btn.translate-btn {
            background: rgba(249, 115, 22, 0.12);
            border: 1px solid rgba(249, 115, 22, 0.3);
            color: #fb923c;
            font-weight: 700;
        }

        .action-btn.translate-btn:hover {
            background: rgba(249, 115, 22, 0.24);
            color: #ffedd5;
        }

        .action-btn.translate-btn.active {
            background: linear-gradient(135deg, #ea580c, #f97316);
            border-color: #fdba74;
            color: #ffffff;
            box-shadow: 0 0 12px rgba(249, 115, 22, 0.45);
        }

        .action-btn.finish-btn {
            background: #22c55e;
            color: #052e16;
            border-color: #4ade80;
            font-weight: 700;
        }

        .action-btn.finish-btn:hover {
            background: #16a34a;
            color: #ffffff;
        }

        .hotkey-badge {
            font-size: 10px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 3px 6px;
            border-radius: 4px;
            color: #a1a1aa;
            font-family: ui-monospace, monospace;
        }
    </style>
</head>
<body>
    <div class="capsule listening" id="capsule" title="Drag to reposition popup anywhere on your screen">
        <!-- Drag Handle Grip -->
        <div class="drag-handle" id="dragHandle" title="Drag to move popup">
            <svg width="8" height="18" viewBox="0 0 8 18" fill="currentColor">
                <circle cx="2" cy="3" r="1.3"/>
                <circle cx="6" cy="3" r="1.3"/>
                <circle cx="2" cy="9" r="1.3"/>
                <circle cx="6" cy="9" r="1.3"/>
                <circle cx="2" cy="15" r="1.3"/>
                <circle cx="6" cy="15" r="1.3"/>
            </svg>
        </div>

        <!-- Mic & Wave Visualizer -->
        <div class="mic-section">
            <div class="mic-icon-wrapper">
                <span class="pulse-ring"></span>
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                    <line x1="12" x2="12" y1="19" y2="22"></line>
                </svg>
            </div>
            <canvas id="miniWaveCanvas"></canvas>
        </div>

        <!-- Center live words -->
        <div class="content-section">
            <div class="status-row">
                <span class="status-dot" id="statusDot"></span>
                <span class="status-text" id="statusLabel">Listening...</span>
            </div>
            <div class="live-text placeholder" id="liveText">Speak now... words appear here</div>
        </div>

        <!-- Right Actions: Translate, Done, Hotkey -->
        <div class="actions-section">
            <button class="action-btn translate-btn" id="btnTranslate" title="Toggle Sarvam AI Translation">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="2" y1="12" x2="22" y2="12"></line>
                    <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                </svg>
                <span id="translateBadgeLabel">Translate</span>
            </button>
            <button class="action-btn finish-btn" id="btnDone" title="Finish and paste at cursor">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
                <span>Done</span>
            </button>
            <span class="hotkey-badge" id="indicatorHotkey">Ctrl+Space</span>
        </div>
    </div>

    <script>
        const capsule = document.getElementById('capsule');
        const statusLabel = document.getElementById('statusLabel');
        const liveText = document.getElementById('liveText');
        const indicatorHotkey = document.getElementById('indicatorHotkey');
        const btnDone = document.getElementById('btnDone');
        const canvas = document.getElementById('miniWaveCanvas');
        const ctx = canvas.getContext('2d');

        // Scale canvas for retina display
        const DPR = window.devicePixelRatio || 1;
        canvas.width = Math.round(36 * DPR);
        canvas.height = Math.round(24 * DPR);
        ctx.scale(DPR, DPR);

        let liveAudioData = null;
        let isTranscribing = false;

        // Draw animated soundwave
        const BAR_COUNT = 4;
        const BAR_W = 2.5;
        const BAR_GAP = 3.5;
        const bars = new Array(BAR_COUNT).fill(4);

        function renderWave(timestamp) {
            ctx.clearRect(0, 0, 36, 24);

            if (liveAudioData && liveAudioData.length > 0) {
                const step = Math.floor(liveAudioData.length / BAR_COUNT);
                for (let i = 0; i < BAR_COUNT; i++) {
                    let sum = 0;
                    for (let j = 0; j < step; j++) {
                        sum += Math.abs((liveAudioData[i * step + j] / 128.0) - 1.0);
                    }
                    const avg = sum / step;
                    const target = Math.min(3 + avg * 45, 18);
                    bars[i] += 0.25 * (target - bars[i]);
                }
            } else {
                for (let i = 0; i < BAR_COUNT; i++) {
                    const wave = 3 + (Math.sin(timestamp / 300 + i) * 0.5 + 0.5) * 6;
                    bars[i] += 0.1 * (wave - bars[i]);
                }
            }

            ctx.fillStyle = isTranscribing ? '#c084fc' : '#4ade80';
            for (let i = 0; i < BAR_COUNT; i++) {
                const h = Math.max(3, bars[i]);
                const x = i * (BAR_W + BAR_GAP) + 4;
                const y = (24 - h) / 2;
                ctx.beginPath();
                ctx.roundRect ? ctx.roundRect(x, y, BAR_W, h, 1.5) : ctx.rect(x, y, BAR_W, h);
                ctx.fill();
            }

            requestAnimationFrame(renderWave);
        }
        requestAnimationFrame(renderWave);

        const btnTranslate = document.getElementById('btnTranslate');
        const translateBadgeLabel = document.getElementById('translateBadgeLabel');

        let currentTargetLang = 'hi-IN';
        let isTranslateActive = false;
        let isSarvamConfigured = false;

        function updateTranslateUI() {
            if (isTranslateActive) {
                btnTranslate.classList.add('active');
                const shortLang = (currentTargetLang || 'hi-IN').split('-')[0].toUpperCase();
                translateBadgeLabel.textContent = `Translate: ${shortLang}`;
                btnTranslate.setAttribute('title', `Sarvam AI Translation Active (${shortLang}). Click to turn off.`);
                if (!isTranscribing) {
                    capsule.className = 'capsule listening translating';
                    statusLabel.textContent = `Listening & Translating (${shortLang})...`;
                }
            } else {
                btnTranslate.classList.remove('active');
                translateBadgeLabel.textContent = 'Translate';
                btnTranslate.setAttribute('title', 'Click to toggle Sarvam AI auto-translation');
                if (!isTranscribing) {
                    capsule.className = 'capsule listening';
                    statusLabel.textContent = 'Listening...';
                }
            }
        }

        // When user clicks Translate toggle button on floating popup
        btnTranslate.addEventListener('click', (e) => {
            e.stopPropagation();
            isTranslateActive = !isTranslateActive;
            updateTranslateUI();

            try {
                if (window.electronAPI) {
                    if (typeof window.electronAPI.toggleIndicatorTranslate === 'function') {
                        window.electronAPI.toggleIndicatorTranslate(isTranslateActive);
                    } else if (typeof window.electronAPI.setSarvamSettings === 'function') {
                        window.electronAPI.setSarvamSettings({ autoTranslate: isTranslateActive });
                    }
                }
            } catch (err) {
                console.error('Failed to toggle translate:', err);
            }
        });

        // ── Public API called from main process ──────────────────────

        function setLiveText(text) {
            if (!text || text.trim().length === 0) return;
            liveText.textContent = text.trim();
            liveText.classList.remove('placeholder');
        }

        function clearLiveText() {
            liveText.textContent = 'Speak now... words appear here';
            liveText.classList.add('placeholder');
        }

        function setRecordingMode(info) {
            isTranscribing = false;
            let hotkey = 'Ctrl+Alt+Space';

            if (typeof info === 'object' && info !== null) {
                hotkey = info.hotkey || hotkey;
                isTranslateActive = Boolean(info.autoTranslate);
                currentTargetLang = info.targetLang || 'hi-IN';
                isSarvamConfigured = Boolean(info.sarvamConfigured);
            } else if (typeof info === 'string') {
                hotkey = info;
            }

            updateHotkeyDisplay(hotkey);
            updateTranslateUI();
            clearLiveText();
        }

        function updateHotkeyDisplay(hotkey) {
            if (!indicatorHotkey) return;
            const text = (hotkey || 'Ctrl+Alt+Space')
                .split('+')
                .map(p => p.trim())
                .join(' + ');
            indicatorHotkey.textContent = text;
        }

        // ── Smooth Dragging on Any OS (Wayland, X11, Windows, macOS) ──
        let isDragging = false;
        let dragStartX = 0;
        let dragStartY = 0;

        function startDrag(e) {
            // Ignore clicks on action buttons
            if (e.target.closest('button, select, input, a')) return;
            isDragging = true;
            dragStartX = e.screenX;
            dragStartY = e.screenY;
            capsule.classList.add('dragging');
            try {
                capsule.setPointerCapture(e.pointerId);
            } catch (err) {}
        }

        function onDrag(e) {
            if (!isDragging) return;
            const deltaX = e.screenX - dragStartX;
            const deltaY = e.screenY - dragStartY;
            dragStartX = e.screenX;
            dragStartY = e.screenY;

            if (deltaX !== 0 || deltaY !== 0) {
                if (window.electronAPI && typeof window.electronAPI.moveIndicator === 'function') {
                    window.electronAPI.moveIndicator(deltaX, deltaY);
                }
            }
        }

        function endDrag(e) {
            if (!isDragging) return;
            isDragging = false;
            capsule.classList.remove('dragging');
            try {
                if (e && e.pointerId) capsule.releasePointerCapture(e.pointerId);
            } catch (err) {}
        }

        capsule.addEventListener('pointerdown', startDrag);
        capsule.addEventListener('pointermove', onDrag);
        capsule.addEventListener('pointerup', endDrag);
        capsule.addEventListener('pointercancel', endDrag);

        function setTranscribingMode() {
            isTranscribing = true;
            if (isTranslateActive) {
                capsule.className = 'capsule transcribing translating';
                const shortLang = (currentTargetLang || 'hi-IN').split('-')[0].toUpperCase();
                statusLabel.textContent = `Translating to ${shortLang}...`;
            } else {
                capsule.className = 'capsule transcribing';
                statusLabel.textContent = 'Transcribing...';
            }
        }

        function setDoneMode() {
            isTranscribing = false;
            capsule.className = isTranslateActive ? 'capsule translating' : 'capsule';
            statusLabel.textContent = isTranslateActive ? '✓ Translated & Pasted' : '✓ Finished & Pasted';
        }

        function updateWaveform(data) {
            liveAudioData = data;
        }

        // When user clicks Done button on capsule
        btnDone.addEventListener('click', (e) => {
            e.stopPropagation();
            try {
                if (window.electronAPI && window.electronAPI.toggleRecording) {
                    window.electronAPI.toggleRecording();
                }
            } catch (e) {}
        });
    </script>
</body>
</html>
